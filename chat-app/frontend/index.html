<!DOCTYPE html>
<html>
<head>
  <title>Salim Chat</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 50px auto; background: #111; color: white; }
    #messages { border: 1px solid #333; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; border-radius: 10px; background: #222; }
    input { width: 70%; padding: 10px; border-radius: 5px; border: none; }
    button { width: 25%; padding: 10px; background: #25D366; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .msg { background: #333; padding: 8px; margin: 5px; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>💬 Salim Smart - Live Chat</h2>
  <div id="messages"></div>
  <input id="input" placeholder="Tape ton message..." />
  <button onclick="sendMessage()">Envoyer</button>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io('http://localhost:3000');
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');

    socket.on('receive_message', (data) => {
      const div = document.createElement('div');
      div.className = 'msg';
      div.textContent = data;
      messages.appendChild(div);
    });

    function sendMessage() {
      if(input.value) {
        socket.emit('send_message', input.value);
        input.value = '';
      }
    }
    input.addEventListener('keypress', (e) => {
      if(e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
